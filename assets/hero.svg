<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="100%" stop-color="#06060c" />
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#0e1222" />
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect x="1" y="1" width="848" height="178" rx="16" fill="url(#heroBg)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />

  
    <rect x="1" y="1" width="848" height="28" rx="16" fill="#080814" />
    <text x="24" y="19" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="800" fill="#00f0ff" letter-spacing="2">[SYS_SCAN // HUD v4.0 ONLINE]</text>
    <text x="826" y="19" font-family="'Courier New', Courier, monospace" font-size="10" font-weight="700" fill="#ffe600" text-anchor="end">TARGET_LOCK: TRUE</text>
    <line x1="1" y1="28" x2="849" y2="28" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />
    <path d="M 12 40 L 12 12 L 40 12" stroke="#00f0ff" stroke-width="2" fill="none" />
    <path d="M 838 40 L 838 12 L 810 12" stroke="#00f0ff" stroke-width="2" fill="none" />
    

  <!-- Avatar Circle with Neon Ring -->
  <g transform="translate(68, 94)">
    <circle cx="0" cy="0" r="40" fill="url(#avatarBg)" stroke="#00f0ff" stroke-width="2" />
    <text x="0" y="10" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="26" font-weight="800" fill="#00f0ff" text-anchor="middle">S</text>
    <circle cx="26" cy="26" r="6" fill="#00f0ff" stroke="#06060c" stroke-width="2" />
  </g>

  <!-- User Details -->
  <g transform="translate(136, 48)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#00f0ff" letter-spacing="0.5">@singh-shashvat</text>
    <text x="0" y="30" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Singh-Shashvat</text>
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="12" font-weight="400" fill="#818cf8">Full-Stack Developer | Building modern web systems &amp; developer tooli</text>

    <!-- Dynamic Skill Pills -->
    <g transform="translate(0, 72)">
      <g transform="translate(0, 0)">
        <rect width="104" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
        <text x="52" y="16" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle">TypeScript</text>
      </g><g transform="translate(112, 0)">
        <rect width="72" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
        <text x="36" y="16" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle">Python</text>
      </g><g transform="translate(192, 0)">
        <rect width="64" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
        <text x="32" y="16" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle">React</text>
      </g><g transform="translate(264, 0)">
        <rect width="80" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
        <text x="40" y="16" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle">Node.js</text>
      </g><g transform="translate(352, 0)">
        <rect width="104" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35" />
        <text x="52" y="16" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="680" y1="36" x2="680" y2="152" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Total Stars Highlight on Right -->
  <g transform="translate(765, 0)">
    <text x="0" y="80" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="34" font-weight="900" fill="#00f0ff" text-anchor="middle" letter-spacing="-1">18</text>
    <text x="0" y="104" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">TOTAL STARS</text>
    <rect x="-50" y="120" width="100" height="22" rx="11" fill="#ffe600" fill-opacity="0.12" stroke="#ffe600" stroke-width="1" stroke-opacity="0.35" />
    <text x="0" y="135" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffe600" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>
</svg>